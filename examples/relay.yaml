# ============================================================================
# treecmd 节点配置 —— 中继节点（relay）
# ============================================================================
#
# 中继 = 树的中间层：**向上连父，向下接子**。它是唯一同时需要"上行 + 下行"两侧材料
# 的角色，也是部署时最容易配错的一个，所以单独给一份样例。
#
# 和另外两种角色的差别只有两处：
#   root  —— 没有 parents[]，证书必须自带（没有父可以签发给它）
#   relay —— **有 parents[]，也有 listen**          ← 本文件
#   leaf  —— 有 parents[]，但没有 listen（不对外接子）
#
# 【中继的两套"证"要分清】
#   ① 我自己的身份材料（keys/ + certs/node.crt）—— 我是被校验的一方
#   ② 我自己的 CA 材料（certs/node.crt.ca + certs/ca.key）—— 我是"给子节点签发的签发方"
#   ③ 信任锚（ca_cert_paths）—— 我是"校验父与对端"的验签方
#
# 【中继证书从哪来】三种都支持，按你的运维习惯选：
#   a) 自带：你的脚本签发后投放到 certs/node.crt（最推荐，完全你掌控）
#   b) 入网：文件不存在 → 启动时向父申请，由父用它的 CA 私钥签发（父要开 enrollment）
#   c) 混合：先入网拿证，之后由你的脚本接管轮换
# ============================================================================

# 【可选 · 默认 1】
version: 1


# ---------------------------------------------------------------------------
# node —— 我是谁、在哪监听
# ---------------------------------------------------------------------------
node:
  # 【必填】本节点身份，UUIDv7，必须与证书身份一致。**也可留空**：程序按 证书身份 → state.dat → 生成 自动定（ADR-050）。
  id: 0198f0c0-0000-7000-8000-000000000002

  # 【可选】节点名 / 备注：人类可读地标记"我是谁"，仅展示用途（随注册上行、API 可见）。
  # 不进 config_hash：改显示名不算拓扑变更，但 SIGHUP 后会主动重注册一次把它同步给父。
  name: relay-sz-02
  remark: "中继 · 二层"

  # 【中继必填】对外监听：子节点连这个地址注册上来。
  # ⚠️ 端口在启动时绑定；改了要重启（SIGHUP 不会重绑）。
  #    建议绑 0.0.0.0:19444（跨机部署）；本机自测用 127.0.0.1:19444。
  listen: 127.0.0.1:19444

  # 【可选】标签 / 能力串，会进 config_hash（改了触发全量重注册）。
  labels: { level: "1", tier: "relay" }
  # capabilities: [ "disk-io" ]


# ---------------------------------------------------------------------------
# parents —— 上游父节点（这是"我是中继而不是根"的标志）
# ---------------------------------------------------------------------------
# 【中继必填】可以写多个，按顺序做故障转移：第一个连不上就试下一个。
# 【必填】id 必须是父**真实的 NodeID**（入网与逐跳校验都按它比对，写错连不上）。
parents:
  - id: 0198f0c0-0000-7000-8000-000000000001
    addr: 127.0.0.1:19443
  # - id: <备用父的真实 NodeID>
  #   addr: 127.0.0.1:19453
#
# ⚠️ parents[] 进 config_hash：改了它发 SIGHUP 会自动触发全量重注册（旧会话作废）。


# ---------------------------------------------------------------------------
# security
# ---------------------------------------------------------------------------
security:
  # ===== ① 我自己的身份材料 =====
  # 【必填】私钥与公钥必须预置（程序绝不生成）。
  # 生成：treecmd-node -genkey -keydir keys -with-ca
  #       ↑ 中继有下级，所以加 -with-ca 一并生成它自己的 CA 密钥对
  identity_key_path: keys/id_ed25519
  identity_pubkey_path: keys/id_ed25519.pub
  # 【按情况】身份证书路径。
  #   自带证书     → 启动时读取并强校验（身份不符 / 链不通 / 过期 → 拒绝启动）
  #   想走入网     → **让这个文件不存在**即可；启动会以"待入网"状态起来，向父换取后写入这里
  identity_cert_path: certs/node.crt

  # ===== ② 我自己的 CA 材料：**中继有下级，必须有** =====
  # 用于给"我的子节点"签证书（含运行期入网）。缺了它们中继拒绝启动。
  # 默认推导：ca_cert_path = <身份证书>.ca、ca_key_path = keys/ca
  ca_cert_path: certs/node.crt.ca
  ca_key_path: keys/ca
  # 若走"入网"拿到身份证书，父会把 CA 证书一并签发下来写入 certs/node.crt.ca；
  # 但 **CA 私钥必须是你自己预置的**（父不可能给你它的私钥）—— 这就是要 -with-ca 的原因。

  # ===== ③ 信任锚：校验父 + 校验所有对端 =====
  # 【非根必填】给文件或给目录都行；给目录最省事（换 CA 只换文件）。
  # 中继要校验"父"和"子"，所以这里必须包含**签发父与子证书的那个 CA**。
  ca_cert_paths:
    - trust

  # ===== 证书热重载 =====
  cert_reload:
    enabled: true
    interval: 30s
    # reconnect（默认）：自己证书/私钥变了才主动重连；lazy：只对新连接生效
    on_change: reconnect
    # 【可选 · 留空=自动】自动监视：身份私钥/公钥/证书 + 本节点 CA 证书/私钥 + 全部信任锚
    # paths: [ keys, certs, trust ]

  # ===== 入网（中继两侧都可能用到）=====
  enrollment:
    # 【可选 · 默认 true】关掉 = 不接受子节点来入网；同时若自己没有证书也不能向父入网
    enabled: true
    # 【按情况】向父入网时提交的许可（父端比对的同一串）。自带证书时这项可省。
    token_path: enroll.token
    # 【可选】父端白名单：只允许这些 NodeID 入网（中继是"父"的角色时生效）
    # allow_ids:
    #   - 0198f0c0-0000-7000-8000-000000000004
    # challenge_ttl: 5m

  # 【可选】授权白名单，留空 = 放行全体合法树成员
  # trusted_origins: []   # 谁能在我这发起指令
  # health_viewers: []    # 谁能查我健康；留空 = 默认"直接父 + root"


# ---------------------------------------------------------------------------
# 运行参数（都可省略，全有默认值；⚠️ 均不进 config_hash，SIGHUP 即可生效）
# ---------------------------------------------------------------------------
# 唯一有硬约束的是租约：renew_at × 3 ≤ lease_ttl，写成别的会被拒绝启动。
command:
  lease_ttl: 90s
  renew_at: 30s
  max_deadline: 24h
  max_inflight: 64
  # 其余旋钮（default_deadline_by_type / audit_retention / eviction_timeout /
  # max_retry_node_count / chunk_size …）见 examples/root.yaml 的完整注释。

health:
  max_health_fanout: 32
  health_response_max_bytes: 1MB
  rate_limit_per_sec: 10

query:
  query_viewers: []          # 留空 = 放行全体树成员
  query_route_ttl: 10s
  max_query_routes: 4096
  query_response_max_bytes: 8MB
  req_auth_ttl: 60s

registration:
  backfill: NONE             # NONE / SINCE / FROM_SEQ；进 config_hash

persist:
  state_path: state.dat
  interval: 10s

# ---------------------------------------------------------------------------
# api —— 中继可以开 HTTP 端点（方便就近提交/排查）；不需要就整段删掉
# ⚠️ 端口在启动时绑定；改了要重启。
# ---------------------------------------------------------------------------
api:
  http_addr: 127.0.0.1:18444

# 【可选 · 默认 .】相对路径的基准目录
data_dir: .
