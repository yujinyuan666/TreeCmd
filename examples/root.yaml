# ============================================================================
# treecmd 节点配置 —— 根节点（root）
# ============================================================================
#
# 【这个文件是什么】
#   每个节点一份 node.yaml。**人写，程序只读，程序绝不回写**。
#   部署形态：单服务器、一个节点一个进程，各自一份 node.yaml + 各自的材料目录。
#
# 【三种角色怎么选】角色由配置自动推导，不用手写某个 role 字段：
#   root  —— 没有 parents[]              → 树的顶点；没有父，所以证书必须自带
#   relay —— 有 parents[] 且有 listen    → 中间层：向上连父、向下接子
#   leaf  —— 有 parents[] 但没有 listen  → 末梢：只向上连父，不对外监听
#
# 【启动前必须准备好的东西 —— 硬约束，缺任何一项都拒绝启动】
#   ① 私钥      keys/id_ed25519           程序绝不生成（防"每次启动都是新身份"）
#   ② 公钥      keys/id_ed25519.pub       程序绝不生成
#   ③ 信任锚    ca_cert_paths             非根节点必填；至少一张 CA 证书
#   ④ 身份证书  certs/node.crt            根没有父可签发 → 必须由你的脚本提供
#   ⑤ CA 证书   certs/node.crt.ca         用于给子节点签发
#   ⑥ CA 私钥   certs/ca.key              用于给子节点签发
#   → ①②⑤⑥ 一次生成：treecmd-node -genkey -keydir keys -with-ca
#
# 【证书谁管】
#   你的脚本负责签发 / 轮换 / 投放；程序只负责"发现变更就重新加载"（见 cert_reload）。
#   换证后 `kill -USR1 <pid>` 秒级生效；不 kill 也行，轮询会在 interval 内发现。
#
# 【上线三步】
#   treecmd-node -check  -config node.yaml   # ① 只读自检：不监听、不连接、不落盘
#   treecmd-node         -config node.yaml   # ② 启动
#   kill -USR1 <pid>                         # ③ 脚本换证后立即重载（无需重启）
#   kill -HUP  <pid>                         #    改了这个文件后热更运行参数
# ============================================================================

# 【可选 · 默认 1】配置格式版本。当前固定写 1，保留给未来做不兼容变更用。
version: 1


# ---------------------------------------------------------------------------
# node —— 我是谁、我在哪监听
# ---------------------------------------------------------------------------
node:
  # 【必填】本节点身份。UUIDv7 格式，**必须与证书里的身份完全一致**（否则启动即拒）。
  # 怎么拿：`uuidgen`；**或者干脆留空** —— 程序会自动定 ID（根自带证书，直接从证书取身份）。
  #         程序对 node.yaml **始终只读**，绝不回写（ADR-050）。
  id: 0198f0c0-0000-7000-8000-000000000001

  # 【可选】节点名：人类可读地标记"我是谁"（如 edge-sz-01 / root-sz-01）。
  # 仅展示用途：随注册上行、在 /v1/tree 与 /v1/health 里可见；**不进 config_hash**。
  name: root-sz-01

  # 【可选】备注：自由文本（机房 / 机柜 / 用途……）。同上，仅展示用途。
  remark: "深圳机房 · 根节点"

  # 【按角色】根必须有（子节点要连它）；中继必须有；叶子留空。
  # ⚠️ 这一项进 config_hash，且**监听端口在启动时绑定**：改了它请重启进程（SIGHUP 不会重绑端口）。
  listen: 127.0.0.1:19443

  # 【可选】任意标签，供你自行分组 / 观测。会进 config_hash（改了触发全量重注册）。
  labels: { level: "0", tier: "root" }

  # 【可选】本节点宣称的能力串，随注册上报给父。会进 config_hash。
  # capabilities: [ "gpu", "disk-io" ]

# 根没有上游，所以**不写 parents[]**。
# 若哪天要把它降级成中继，就补上 parents[]（角色会自动变成 relay）。
#
# parents:
#   - id: <父的真实 NodeID>
#     addr: <父的监听地址，如 127.0.0.1:19443>
#   # 可以写多个：按顺序做故障转移（第一个连不上就试下一个）


# ---------------------------------------------------------------------------
# security —— 身份材料、信任锚、证书生命周期、入网策略（部署最关键的一段）
# ---------------------------------------------------------------------------
security:
  # ===== 身份材料：**必须预置**，程序绝不生成 =====
  # 【必填 · 默认 keys/id_ed25519】
  identity_key_path: keys/id_ed25519
  # 【必填 · 默认 <私钥>.pub】
  identity_pubkey_path: keys/id_ed25519.pub
  # 【必填 · 默认 certs/node.crt】身份证书链（PEM，可含中间证书）。
  # 根节点：必须自带。其它节点：可留空文件 → 启动时向父入网换取（见 enrollment）。
  identity_cert_path: certs/node.crt

  # ===== 本节点自己的 CA 材料：**有子节点的节点（根 / 中继）必需 =====
  # 和下面的"信任锚"是两件事，别混：
  #   ca_cert_path / ca_key_path = 我**用来给子节点签发**的（我是签发方）
  #   ca_cert_paths              = 我**用来校验对端**的（我是验签方）
  # 【可选 · 默认 <身份证书>.ca】建议显式写出来，别依赖推导
  ca_cert_path: certs/node.crt.ca
  # 【可选 · 默认 certs/ca.key】给子节点签发的 CA 私钥；缺文件时：叶子不受影响，根/中继拒绝启动
  ca_key_path: keys/ca

  # ===== 信任锚：校验父与其它对端用 =====
  # 【非根必填】可以给**文件**，也可以给**目录**（目录下 *.crt / *.pem 全部加载）。
  # 给目录的好处：换 CA 只换文件、不用改配置、也不用重启（信任锚对新连接立即生效）。
  ca_cert_paths:
    - trust

  # ===== 证书热重载：把"你脚本的换证动作"吃进来 =====
  # 【可选】整段不写 = 开启 + 30s 轮询 + reconnect。
  cert_reload:
    enabled: true
    # 轮询间隔，下限 5s。稳态只做 stat（不读文件内容），开销可忽略。
    interval: 30s
    # 【可选 · 默认自动】额外监视的路径（文件或目录）。
    # 留空 = 自动监视：身份私钥 / 公钥 / 证书 + 本节点 CA 证书 / 私钥 + 全部信任锚。
    # paths: [ keys, certs, trust ]
    #
    # 变更后如何让新证书生效（二选一）：
    #   reconnect（默认）—— 只有"本节点身份证书 / 私钥"变了才主动重连一次（尽快用新证书握手）；
    #                       换 CA、换对端证书这类不影响自己身份的变更，只对新连接生效，不打扰现有会话。
    #   lazy             —— 一律只对新连接生效，绝不打断任何现有会话。
    on_change: reconnect

  # ===== 运行期入网：子节点没有证书时，用许可向父换取 =====
  # 根节点这一段的作用是"**允许别人来入网**"；子节点那一段的作用是"我去换"。
  enrollment:
    # 【可选 · 默认 true】关掉 = 本节点不接受任何入网请求（已自带证书的树可以关）
    enabled: true
    # 【可选】入网许可：父端比对此串；子端提交同一串。两种给法，token_path 优先：
    #   token_path: 从文件读（推荐，权限 600，便于部署时投放 / 轮换）
    #   token:      直接写在配置里
    token_path: enroll.token
    # token: <与子节点一致的许可串>
    #
    # 【可选】父端白名单：只允许这些 NodeID 入网。留空 = 只校验 token。
    # 想收紧到"名单内 + 有许可才发证"就把子节点 ID 列进来。
    # allow_ids:
    #   - 0198f0c0-0000-7000-8000-000000000003
    #
    # 【可选 · 默认 5m】一次性挑战（nonce）的有效期，超时需重新申请。
    # challenge_ttl: 5m

  # ===== 授权白名单（留空 = 放行全体合法树成员，够用就别写）=====
  # 【可选】谁可以在本节点发起指令。留空 = 不限（仍要求是可信树成员）。
  # trusted_origins: []
  # 【可选】谁可以查本节点的健康/轨迹。留空 = 默认"直接父 + root"。写 "*" 表示不限。
  # health_viewers: []
  # ⚠️ 这三项（含 query.query_viewers）**不进 config_hash**：改了发 SIGHUP 即刻生效，不触发重注册。


# ---------------------------------------------------------------------------
# command —— 指令分发 / 租约 / 超时 等的本地运行参数
# 整段都可以不写，全部有默认值。这里列出的都是"你可能会想调"的。
# ⚠️ 本段所有字段**不进 config_hash**：改完发 SIGHUP 即刻生效。
# ---------------------------------------------------------------------------
command:
  # 租约有效期：父把任务派给子后，子必须在这个时间内续租，否则父判定它掉了并回收重派。
  lease_ttl: 90s
  # 子续租的间隔。**硬约束：renew_at × 3 ≤ lease_ttl**，违反直接拒绝启动。
  renew_at: 30s
  # 单条指令的绝对上限：超过它一律按超时收尾（防止一条永远跑不完的指令挂住整条链）。
  max_deadline: 24h
  # 各指令类型的兜底期限（写在指令里没给 deadline 时用它）。未列出的类型用 unknown_type_deadline。
  default_deadline_by_type: { noop: 1m, echo: 1m, probe: 5m, sleep: 5m, shell: 1h, batch: 6h }
  unknown_type_deadline: 15m
  # 指令审计记录保留多久（超过且已终态就被清理）。
  audit_retention: 168h
  # 子节点多久没出现算"被驱逐"（驱逐前会把指令体归档，等它回来对账）。
  eviction_timeout: 24h
  # 驱逐归档保留多久（到期连同水位条目一起回收，避免表无界增长）。
  eviction_archive_retention: 720h
  # 本节点同时执行的本地指令上限（超了会回 LocalBusy 让父稍后重投，从而保护本机）。
  max_inflight: 64
  # 大结果（>64MB）落本地对象存储的目录；相对路径按 data_dir 展开。
  # object_store_dir: objects
  #
  # 下面这些是内部水位 / 分片 / 重试旋钮，默认值都够用，一般不用动（默认值列在注释里）：
  #   stream_idle_timeout: 180s      分片上传流的空闲超时
  #   reserve_for_report: 5s         为"末段上报"预留的时间，避免压着 deadline 丢结果
  #   child_stuck_timeout: 5m        子节点"还连着但卡住"的判定阈值
  #   lease_reclaim_cap: 3           同一子节点的租约最多连续回收几次
  #   max_retry_node_count: 3        单个子节点失败后最多重派几次，超了由父直接判定失败
  #   local_busy_backoff: 3s         收到 LocalBusy 后父等待多久再投
  #   pending_resend_batch: 32       一次补报多少条待上报结果
  #   max_report_concurrency: 8      并发处理子报告的上限
  #   index_repush_interval: 10m     结果索引向上重推的间隔
  #   tick_interval: <自动>          waitChildren 的巡检间隔，默认按 child_stuck_timeout/4 推导（下限 200ms）
  #   reconcile_window: <自动>       "应发未发"对账窗口，默认 3 × renew_at
  #   max_payload: 1MB               单条指令 payload 上限
  #   max_command_bytes: 3MB         单条 Command 序列化上限（超了父端截断）
  #   fetch_response_max_bytes: 3.5MB 一次 FetchCommands 响应的上限
  #   max_chunk_total: 300           分片上传的最大片数
  #   chunk_size: 256KB              分片大小


# ---------------------------------------------------------------------------
# health —— 全树健康检查 / 指令轨迹
# ⚠️ 不进 config_hash，SIGHUP 即可生效。
# ---------------------------------------------------------------------------
health:
  # 一个节点向下扇出的最大并发（防止健康请求把大树打爆）。
  max_health_fanout: 32
  # 单次健康响应的大小上限，超了自动降级为"只回摘要不带完整对象"。
  health_response_max_bytes: 1MB
  # 每个对端每秒允许发起的健康请求数（防刷）。
  rate_limit_per_sec: 10


# ---------------------------------------------------------------------------
# query —— 结果查询（GET /v1/commands/{id}）
# ⚠️ 不进 config_hash，SIGHUP 即可生效。
# ---------------------------------------------------------------------------
query:
  # 谁可以查结果。**留空 = 放行全体合法树成员**；写 "*" 同理；列具体 NodeID 才收紧。
  query_viewers: []
  # 查询回程转发表条目的存活时间（超过就丢弃，回程靠重新查询）。
  query_route_ttl: 10s
  # 回程转发表的最大条目数。
  max_query_routes: 4096
  # 单次查询响应的大小上限，超了走分片回传（>256KB）或对象存储引用（>8MB）。
  query_response_max_bytes: 8MB
  # 跨跳委托凭证（ReqAuth）的有效期。
  req_auth_ttl: 60s


# ---------------------------------------------------------------------------
# registration —— 注册行为
# ⚠️ 进 config_hash，改了触发全量重注册。
# ---------------------------------------------------------------------------
registration:
  # 重连后要不要补拉"断线期间错过"的指令。NONE = 不补（只处理新指令）。
  # 可选：NONE / SINCE（按时间补）/ FROM_SEQ（按序号补）
  backfill: NONE


# ---------------------------------------------------------------------------
# persist —— 本地状态落盘
# ⚠️ 不进 config_hash，SIGHUP 即可生效（interval）。
# ---------------------------------------------------------------------------
persist:
  # 运行态快照文件（原子写）。账本另有一个 state.db（bbolt），与它同目录。
  state_path: state.dat
  # 快照落盘间隔。
  interval: 10s


# ---------------------------------------------------------------------------
# api —— 对外 HTTP 端点（提交指令 / 查结果 / 健康 / 指标）
# ---------------------------------------------------------------------------
# 【可选】不写 = 不开 HTTP 端点（纯中间层可以不开）。
# 端点：POST /v1/commands、GET /v1/commands/{id}、cancel、retry、
#       GET /v1/health、GET /v1/tree、GET /v1/crl、POST /v1/revoke、GET /metrics
# ⚠️ HTTP 监听同样在启动时绑定：改了它请重启（SIGHUP 不会重绑端口）。
api:
  http_addr: 127.0.0.1:18443


# ---------------------------------------------------------------------------
# data_dir —— 相对路径的基准目录（默认 = node.yaml 所在目录）
# ---------------------------------------------------------------------------
# 上面所有相对路径（keys/、certs/、trust/、state.dat、objects/）都相对它展开。
# 【可选 · 默认 .】
data_dir: .
