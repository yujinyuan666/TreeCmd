# ============================================================================
# treecmd 节点配置 —— 末梢叶子（leaf）· 最小形态
# ============================================================================
#
# 【核心结论】叶子只需要两件事：**我是谁 + 父节点地址**。
#   下面这 5 行就是一份能跑起来的完整配置：
#
#       node:  { id: <我的 NodeID> }
#       parents:
#         - id: <父的真实 NodeID>
#           addr: <父的监听地址>
#
#   其余全部按下面的"约定"补全。`treecmd-node -check` 会把**替你补了哪些**逐条列出来，
#   不留隐式行为 —— 想显式覆盖就在本文件里把对应项写出来（文末有模板）。
#
# ---------------------------------------------------------------------------
# 【本节点目录下应有什么】叶子目录（约定名，都相对 data_dir，即 node.yaml 所在目录）
#
#   启动**前**必须放好：
#     keys/id_ed25519            本节点私钥      ← 程序不生成，必须你来
#     keys/id_ed25519.pub        本节点公钥      ← 程序不生成，必须你来
#     trust/                     目录，放 CA 证书（信任锚）← 你的证书脚本投
#     enroll.token               入网许可（内容与父端一致，chmod 600）← 你的脚本投
#                                 （父端若只配了 allow_ids 白名单，则这一项可省）
#
#   启动**后**由程序自己生成（你不用管）：
#     certs/node.crt             本节点证书：向父入网换取后写入
#     state.db / state.dat       本地账本与状态快照
#     objects/                   大结果（>64MB）的对象存储
#     node.log / node.pid        start_node.sh 产出的日志与 PID
#
#   一次性生成密钥对的命令：
#     treecmd-node -genkey -keydir keys        # 叶子：不需要 CA，别加 -with-ca
#
# ---------------------------------------------------------------------------
# 【五步上线】
#   mkdir -p keys trust certs
#   treecmd-node -genkey -keydir keys                      # ① 生成密钥对
#   cp <你的脚本产出的 CA 证书> trust/                      # ② 投放信任锚
#   echo -n '<与父端一致的许可串>' > enroll.token && chmod 600 enroll.token   # ③ 投放许可
#   treecmd-node -check  -config node.yaml                  # ④ 自检（只读，不监听不连接）
#   treecmd-node         -config node.yaml                  # ⑤ 启动 → 自动入网 → 自动注册
#
# 【之后】你的脚本换证时：kill -USR1 <pid>（或等轮询间隔，默认 30s）自动重载，无需重启。
# ============================================================================

# 【可选 · 默认 1】
version: 1


# ---------------------------------------------------------------------------
# node —— 我是谁
# ---------------------------------------------------------------------------
node:
  # 【必填】本节点身份，UUIDv7。**必须与证书里的身份一致**。
  # 证书是父签发下来的，所以这个 ID 要先告诉父（父签发时按它写进证书主题）。
  # ✨ **也可以留空**：程序自动定 ID（没有证书就生成一个并记进 state.dat），再拿它向父入网换证 ——
  #    这样"新节点上线"就不需要先手工编 UUID 再拿去签发了。程序对 node.yaml **始终只读**。
  id: 0198f0c0-0000-7000-8000-000000000003

  # 【可选】节点名 / 备注：人类可读地标记"我是谁"，只在展示面出现（注册上行 / API 可见），
  # 不参与权限判定，也不进 config_hash。
  name: edge-sz-03
  remark: "1 号柜 3 号机位"

  # 叶子**不写 listen**：它不对外接子节点，也就没有监听端口。
  # （哪天要给这个节点挂下级，补上 listen 就自动变成 relay 角色。）
  # listen: 127.0.0.1:19445

  # 【可选】标签 / 能力串，会随注册上报给父，也进 config_hash。
  labels: { level: "2", tier: "leaf" }
  # capabilities: [ "gpu" ]


# ---------------------------------------------------------------------------
# parents —— 父节点地址（叶子的第二个必填项）
# ---------------------------------------------------------------------------
# 【必填】id 必须是父**真实的 NodeID**（不是主机名、不是路径）。
#        入网签发的挑战校验、逐跳背书校验都按它比对；写错会连不上或被拒。
# addr 是父的 **node.listen**（注意：不是它的 api.http_addr）。
parents:
  - id: 0198f0c0-0000-7000-8000-000000000001
    addr: 127.0.0.1:19443
  # 可写多个做故障转移，按顺序尝试：
  # - id: <备用父的真实 NodeID>
  #   addr: 127.0.0.1:19453


# ===========================================================================
# 以下是"约定与默认值"，**不写也能跑**。写出来只有两种情况：
#   ① 你的目录布局和约定不一样，要指到别处；
#   ② 想显式声明、避免"靠约定"的隐式行为。
# 全部取消注释即为"显式版"。对应默认值就写在注释里。
# ===========================================================================
#
# security:
#   # --- 身份材料（默认路径） ---
#   identity_key_path: keys/id_ed25519
#   identity_pubkey_path: keys/id_ed25519.pub
#   identity_cert_path: certs/node.crt        # 文件不存在 = 待入网，启动后向父换取
#
#   # --- 信任锚（**非根必填**）：给文件或给目录，目录下 *.crt/*.pem 全加载 ---
#   # 未配置时会自动探测约定目录 trust/（存在才生效）
#   ca_cert_paths:
#     - trust
#
#   # --- 证书热重载（整段省略 = 开启 + 30s + reconnect）---
#   cert_reload:
#     enabled: true
#     interval: 30s                           # 下限 5s；稳态只做 stat，开销可忽略
#     on_change: reconnect                    # reconnect | lazy（lazy = 绝不打断现有会话）
#     # paths: [ keys, certs, trust ]         # 留空 = 自动（身份材料 + 本节点 CA + 信任锚）
#
#   # --- 入网（叶子是"去换证"的一方）---
#   enrollment:
#     enabled: true
#     token_path: enroll.token                # 未配置时自动探测约定文件 enroll.token
#     # token: <许可串>                        # 也可以直接写在这里（token_path 优先）
#     # allow_ids: [ ... ]                    # 这是"父"的角色才用的白名单，叶子用不到
#     # challenge_ttl: 5m
#
#   # --- 授权白名单（留空 = 放行全体合法树成员）---
#   # trusted_origins: []                     # 谁能在我这发起指令
#   # health_viewers: []                      # 谁能查我健康；留空 = 默认"直接父 + root"
#
# # --- 本地运行参数（省略即默认；⚠️ 不进 config_hash，改了发 SIGHUP 即可）---
# command:
#   lease_ttl: 90s
#   renew_at: 30s                             # 硬约束：renew_at × 3 ≤ lease_ttl
#   max_deadline: 24h
#   max_inflight: 64                          # 本机同时执行的指令上限（保护本机）
#   # 其余旋钮见 examples/root.yaml 的完整注释
#
# health:
#   max_health_fanout: 32
#   health_response_max_bytes: 1MB
#   rate_limit_per_sec: 10
#
# query:
#   query_viewers: []                         # 留空 = 放行全体树成员
#   query_route_ttl: 10s
#   max_query_routes: 4096
#   query_response_max_bytes: 8MB
#   req_auth_ttl: 60s
#
# registration:
#   backfill: NONE                            # NONE / SINCE / FROM_SEQ
#
# persist:
#   state_path: state.dat
#   interval: 10s
#
# # --- 叶子通常不开 HTTP 端点；要开就写 ---
# # api:
# #   http_addr: 127.0.0.1:18445
#
# # --- 相对路径的基准目录（默认 = node.yaml 所在目录）---
# data_dir: .

# 保持显式：这一项按约定是 "."，写出来更清楚
data_dir: .
