# ============================================================================
# treecmd 节点配置（node.yaml）—— 唯一一份权威样例
# ============================================================================
#
# 【这个文件是什么】
#   每个节点一份 node.yaml。**人写、程序只读、程序绝不回写**（ADR-005）。
#   这里是唯一的样例：既给出"按角色最简起步"，也把**全部字段**连同角色与默认值逐条注释。
#   （原先的 root / relay / child / leaf 四份样例已合并进本文件。）
#
#   ⚠️ 本文件里**没被注释掉**的那些行，写出来的是**根（root）形态**。
#     中继 / 叶：按每行前面的角色标记增删即可 —— 需要改的其实只有 4 个字段（见下）。
#
# ---------------------------------------------------------------------------
# 【三种角色怎么选】角色由配置自动推导，没有 role 字段可写：
#   root   没有 parents[]                → 树的顶点。没有父 ⇒ **证书必须自带**
#   relay  有 parents[] 且 有 listen     → 中间层：向上连父、向下接子
#   leaf   有 parents[] 但 没有 listen   → 末梢：只向上连父，不对外接子
#
#   三种角色的差别只有 4 个字段：
#     node.listen                          根必须有 / 中继必须有 / 叶不写
#     parents[]                            根不写   / 中继必填   / 叶必填
#     security.ca_cert_path、ca_key_path   有下级才要（根、中继）/ 叶不写
# ---------------------------------------------------------------------------
#
# 【按角色最简起步】把对应那一段抄进你的 node.yaml 就能跑，其余按"约定与默认值"补全：
#
#   ── 根（root）：没有父，所以证书与 CA 材料必须自带 ──────────────────────────
#     node:
#       id: <你的 NodeID；也可留空让程序自动定>
#       listen: 0.0.0.0:19443
#     security:
#       ca_cert_paths: [ trust ]
#     # 材料：keys/id_ed25519{,.pub} + keys/ca（+ ca.pub）+ certs/node.crt + certs/node.crt.ca
#     # 一次性生成：**在节点目录里**跑 scripts/init_root.sh（不带参数即可 —— NodeID 会自动生成）
#
#   ── 中继（relay）：向上连父 + 向下接子，两侧材料都要 ────────────────────────
#     node:
#       id: <你的 NodeID>
#       listen: 0.0.0.0:19444
#     parents:
#       - id: <父的真实 NodeID>
#         addr: <父的 node.listen>
#     security:
#       ca_cert_paths: [ trust ]
#     # 材料：keys/id_ed25519{,.pub} + keys/ca（**有下级必须有**，生成时加 -with-ca）
#     #       + enroll.token —— **父产出的「入网引导凭据」**（permit + 父的 CA 链，一份文件全带）
#     #         产出：在父节点目录上跑 scripts/make_bootstrap.sh <父目录>（根由 init_root.sh 顺带产出）
#     # 自己的证书可以自带、也可以让 certs/node.crt 不存在 → 启动时向父入网换取
#     # ⚠️ 凭据里既然已经内嵌了父的 CA，trust/ 与 ca_cert_paths 就都不必再配；
#     #    而且入网成功后连凭据也可以删（信任锚会从自己的证书链自举）
#
#   ── 叶（leaf）：只要"我是谁 + 父地址"+ 密钥对 + 一份父给的凭据 ──────────────
#     node:
#       id: <你的 NodeID>
#     parents:
#       - id: <父的真实 NodeID>
#         addr: <父的 node.listen>
#     security:
#       enrollment: { enabled: true, token_path: enroll.token }
#     # 材料：keys/id_ed25519{,.pub}（treecmd-node -genkey -keydir keys，**别加 -with-ca**）
#     #       + enroll.token（**父产出的引导凭据，整份拷过来**：许可与父的 CA 都在里面）
#     # —— 不需要 trust/、不需要 ca_cert_paths、不需要知道根是谁。
# ---------------------------------------------------------------------------
#
# 【启动前必须准备好的东西】硬约束：缺任何一项都会 REFUSE TO START 并以非零码退出
#   keys/id_ed25519        身份私钥        ← 程序绝不生成（否则"每次启动都是新身份"）
#   keys/id_ed25519.pub    身份公钥        ← 程序绝不生成
#   enroll.token           **入网引导凭据** ← 父产出、整份拷给子节点（权限 600）。
#                                           = 入网许可 + 父的 CA 证书链（含父 CA 到根），
#                                           **一份文件就够首跳**：许可管"父要不要收我"、
#                                           内嵌的 CA 管"对端是不是父"（见 identity.ParseBootstrap）
#   certs/node.crt         身份证书        ← 根必须自带（没有父能签发给它）
#                                           其它角色可让它不存在 → 启动时向父入网换取
#   keys/ca                本节点 CA 私钥   ← 有下级才需要（根、中继）
#   certs/node.crt.ca      本节点 CA 证书   ← 有下级才需要
#   trust/                 信任锚（**可省**）← 口径是**你的父**（父的 certs/node.crt.ca 整份文件，
#                                            含父 CA 到根），不是"树的根"，不需要从根拷任何东西。
#                                            ⚠️ 已经用引导凭据时这一项完全不用配；
#                                            就算配了，也只在**首次入网**时必需 ——
#                                            入网成功后锚从自己的证书链自举，可以删掉
#
# 【证书谁管】签发 / 轮换 / 投放都由你的脚本负责；程序只负责"发现变更就重新加载"
#   （见下面的 security.cert_reload）。换证后 `kill -USR1 <pid>` 立即生效；
#   不 kill 也行 —— 轮询会在 cert_reload.interval（默认 30s）内发现。
#
# 【上线 & 热更】
#   treecmd-node -config node.yaml     # 启动（材料有问题会 REFUSE TO START 并非零退出）
#   kill -USR1 <pid>                   # 脚本换证后立即重载证书（无需重启）
#   kill -HUP  <pid>                   # 改了这个文件后重读（整体替换运行时配置）
#   ⚠️ 端口类（node.listen / api.http_addr）在**启动时绑定**：改了必须重启进程。
# ============================================================================


# ============================================================================
# 第一部分 · 逐字段详解
#
#   行前标记的含义：
#     【必填】缺了拒绝启动                        【可选】有默认值，不写也能跑
#     【根…】【中继…】【叶…】         该字段只在对应角色需要
#     【进 hash】写进 config_hash：改了触发**全量重注册**（旧会话作废）
# ============================================================================

# 【可选 · 默认 1】配置格式版本。当前固定写 1，留给未来做不兼容变更。
version: 1


# ---------------------------------------------------------------------------
# node —— 我是谁、在哪监听
# ---------------------------------------------------------------------------
node:
  # 【可选·进 hash】本节点身份（UUIDv7）。**留空也能跑**：程序按"证书身份 → state.dat
  #   → 新生成"的顺序自己定下来，新生成的值写进 state.dat（程序对 node.yaml 始终只读，ADR-050）。
  #   已有证书的节点：**必须与证书里的身份一致**，否则启动即拒。
  id: 0198f0c0-0000-7000-8000-000000000001

  # 【可选】节点名：人类可读地标记"我是谁"（如 root-sz-01）。
  #   仅展示用途：随注册上行、在 /v1/tree 与 /v1/health 里可见；**不进 config_hash**。
  #   改完 SIGHUP 会主动重注册一次，把新名字同步给父（ADR-051）。
  name: root-sz-01

  # 【可选】备注：自由文本（机房 / 机柜 / 用途……）。同上，仅展示用途。
  remark: "深圳机房 · 根节点"

  # 【根·必填】【中继·必填】【叶·不写】对外监听地址：子节点连这里注册上来。
  #   ⚠️ 进 config_hash，且端口在**启动时**绑定：改完必须重启进程（SIGHUP 不会重绑端口）。
  #   跨机部署写 0.0.0.0:19443；本机自测写 127.0.0.1:19443。
  listen: 127.0.0.1:19443



# ---------------------------------------------------------------------------
# api —— 对外 HTTP 端点（提交指令 / 查结果 / 健康 / 指标 / 运维）
#   【可选】不写 = 不开 HTTP 端点（纯中间层可以不开）。
#   端点：POST /v1/commands、GET /v1/commands/{id}（cancel / retry 同前缀）、
#         GET /v1/health、GET /v1/tree、GET /v1/crl、POST /v1/crl、
#         GET/POST /v1/forget、GET /metrics、GET /v1/healthz
#   ⚠️ 端口在启动时绑定：改了必须重启进程（SIGHUP 不会重绑）。
# ---------------------------------------------------------------------------
api:
  http_addr: 127.0.0.1:18443

  # ===== 访问控制：一律要 user token，没有免签来源 =====
  # 写接口里有几个**不可逆**的动作：POST /v1/crl 吊销节点、POST /v1/forget 清注册状态、
  # POST /v1/commands 让整棵子树干活；读接口也暴露拓扑与结果。所以**除存活探针外**
  # 一切请求都要出示凭据 —— 不管从哪来（本机 / 局域网 / 外网）。
  #
  # 口径（前一条命中就不再往下判）：
  #   ① api.tls.require 打开而请求是明文 —— 拒绝（含回环来源）；
  #   ② /v1/healthz 永远放行（存活探针，只回 ok / node_id / path）；
  #   ③ 其余一切请求必须带 X-Treecmd-Token，且能在本节点 user/ 目录里找到并验签通过；
  #      找不到 ⇒ 401。**读接口也在内**。
  #
  # 凭据怎么来（见 internal/node/usertoken.go）：
  #   treecmd-node -config node.yaml -adduser <用户名>
  #     → 用本节点 CA 私钥（security.ca_key_path）签一份 token，写进 user/<用户名>
  #       （目录 0700、文件 0600），**文件内容就是要出示的凭据**：
  #       <16 位随机串>.<base64(CA 对 域+用户名+随机串 的 Ed25519 签名)>
  #
  # 请求头只有一项：
  #   X-Treecmd-Token: <user/<用户名> 文件的全部内容>
  #
  # 特性：
  #   · **签了就生效、删了就失效**（节点按 user/ 目录变化自动重扫，不用重启、不用 SIGHUP）；
  #     `rm user/<用户名>` 就是收回那个人的权限；
  #   · 逐份验签 ⇒ 手动往 user/ 里塞一个自己编的文件**不算授权**；
  #   · `-adduser` 默认拒绝覆盖已存在的用户名（不悄悄换掉在用的凭据），要换加 -force；
  #   · user 目录固定在节点目录下，没有配置项（落点少一个自由度就少一次配歪的机会）。
  #
  # ⚠️ **不要按来源地址区分身份**：判据只能是 TCP 对端地址，而它会被部署形态改写 ——
  #    API 端口前面挂了反向代理 / 端口转发（nginx、ssh -L、frpc、kubectl port-forward）时，
  #    所有请求的对端都变成 127.0.0.1。历史上这里就用过"回环免签"（后来还加过转发头检测 +
  #    trusted_proxies 白名单），**已整套删除**：现在带不带 X-Forwarded-For 结论都一样。
  # ⚠️ token 是长期凭据、每个请求都会上线：跨不可信网络请开下面的 api.tls（建议 require: true）。
  # 【可选】整段只写 http_addr 是合法的：此时除 /v1/healthz 外都进不来，启动日志会 WARN 提示
  # 怎么发凭据。所以这里**没有 auth 段**（旧版本的 api.secret / secret_path / protect_reads /
  # loopback_bypass / trusted_proxies / bind_host / channel_binding 均已废弃，写了会被忽略）。

  # ===== TLS：让端点改以 HTTPS 提供（防窃听 / 防响应伪造）=====
  # 【可选】不写 = 明文 HTTP（与历史行为一致；对外监听时启动会打 WARN）。
  # 配了 cert_path + key_path 就改以 HTTPS 提供，证书**热重载**（换文件不用重启）。
  # tls:
  #   cert_path: certs/api.crt    # 服务端证书（PEM，可含链）
  #   key_path:  certs/api.key    # 私钥，权限 600
  #   # 【可选】true = 这个端点**只以 HTTPS 提供**：明文请求一律拒绝（**含回环来源**）。
  #   # 为什么连回环也要管：TLS 终止型反向代理（对外 HTTPS、回源走明文）会把远程请求
  #   # 以"看起来像本机"的明文请求递进来；而且明文链路上 token 本来就会被抓走。
  #   require: true
  #   # ===== 以下两项是 mTLS（客户端也出示证书）时才配 =====
  #   ca_path: certs/api-ca.crt   # 校验客户端证书的 CA（文件或目录）
  #   client_auth: require        # off（默认）| optional（要了就验）| require（必须有且验过）
  #   # （没有"出示客户端证书就免 token"这种开关：mTLS 只加固传输层，授权判据始终是 token。）
  #   min_version: "1.2"          # 或 "1.3"

# ---------------------------------------------------------------------------
# parents —— 上游父节点（写了它就是"非根"）
# ---------------------------------------------------------------------------
# 【根·不写】【中继·必填】【叶·必填】【进 hash】改了会触发全量重注册（旧会话作废）。
#   id   必须是父**真实的 NodeID**（不是主机名、不是路径）：入网签发的挑战校验与逐跳
#        背书校验都按它比对，写错会连不上或被拒。
#   addr 是父的 **node.listen**（注意：不是它的 api.http_addr）。
#   可以写多个，按顺序做故障转移：第一个连不上就试下一个。
#
# parents:
#   - id: 0198f0c0-0000-7000-8000-000000000001
#     addr: 127.0.0.1:19443
#   - id: <备用父的真实 NodeID>
#     addr: 127.0.0.1:19453


# ---------------------------------------------------------------------------
# security —— 身份材料、信任锚、证书生命周期、入网策略（部署最关键的一段）
# ---------------------------------------------------------------------------
security:
  # ===== 身份材料：**必须预置**，程序绝不生成 =====
  # 【必填·默认 keys/id_ed25519】【进 hash】
  identity_key_path: keys/id_ed25519
  # 【必填·默认 <私钥>.pub】【进 hash】与私钥成对；缺失即拒绝启动（程序不做推导生成）
  identity_pubkey_path: keys/id_ed25519.pub
  # 【必填·默认 certs/node.crt】【进 hash】身份证书链（PEM，可含中间证书）。
  #   根：必须自带。其它角色：**让这个文件不存在**即可 → 以"待入网"状态起来，向父换取后写入这里。
  identity_cert_path: certs/node.crt

  # ===== 本节点自己的 CA 材料：**有下级的节点（根 / 中继）必需** =====
  # 别和下面的"信任锚"混：
  #   ca_cert_path / ca_key_path = 我**用来给子节点签发**的（我是签发方）
  #   ca_cert_paths              = 我**用来校验对端**的（我是验签方）
  #
  # 【根·必填】【中继·必填】【叶·不写 · 默认 <身份证书>.ca】【进 hash】
  #   建议显式写出来，别依赖推导。
  ca_cert_path: certs/node.crt.ca
  # 【根·必填】【中继·必填】【叶·不写 · 默认 keys/ca】【进 hash】
  #   给子节点签发的 CA 私钥。缺文件时：叶子不受影响，根 / 中继拒绝启动。
  #   ⚠️ 走"向父入网"拿到身份证书的节点，父会把 CA **证书**一并写下来；
  #      但 CA **私钥**必须你自己预置（父不可能给你它的私钥）—— 这就是要 -with-ca 的原因。
  ca_key_path: keys/ca

  # ===== 信任锚：校验父与其它对端用 =====
  # 【可选】【进 hash】可以给**文件**，也可以给**目录**（目录下 *.crt / *.pem 全部加载）。
  #   ⚠️ 口径不是"树的根"，而是**你的父**：把父的 `certs/node.crt.ca`（**整份文件**，
  #      内容含父 CA 一路到根）指过去就行 —— **不需要从根拷任何东西**。链能不能验通只看
  #      "能不能接到某个锚"，而"放父的这份文件"与"放根 CA"的判定结果**完全等价**。
  #   ⚠️ 它只在**首次入网**（手上还没有证书）时必需：入网成功后信任锚会从**本节点自己的
  #      证书链**自举（链本身就是 `[我, 父CA, …, 根CA]`），这两项都可以删掉、这一整段可以不写。
  #      日志里会出现「信任锚来自自身证书链自举（未配置 security.ca_cert_paths）」。
  #       —— 这正是"每个节点只对自己的父节点负责"在部署上的落点：子节点不必认识根。
  #   ⚠️ 要放**整份文件**：只截取"父那一张"而漏掉根的话，**上级节点签发的跨跳委托（ReqAuth）
  #      在孙节点上会验不过**（那条链的末端是根）。
  #   给目录的好处：换 CA 只换文件、不用改配置、也不用重启（新连接立即生效）。
  #   ⚠️ 想交给自举就把**目录与这一段一起删掉**：留一个**空的 trust/ 目录**会被判成
  #      "配了锚却没有证书" 而拒绝启动（刻意的 fail-fast，不静默降级）。
  ca_cert_paths:
    - trust

  # ===== 证书生命期（天）：★ 不进 config_hash =====
  # 默认值就是历史行为：身份证书 30 天、CA 证书 3650 天（10 年）。
  # 改它们只影响"以后签出来的证书多久过期"，不影响拓扑 / 会话 / 身份，所以**不需要重注册**。
  #
  # 为什么 CA 证书也敢配短：它现在**可以在线轮换**且**只换证书、不换密钥** ——
  # 公钥不变 ⇒ 下级手里的旧 CA 证书在有效期内仍然有效、trust/ 完全不用重新分发、
  # 下级也不用重新入网（见 README「证书生命周期」与 internal/identity 的 ReissueCAFor）。
  # ⚠️ 它**不解决换 CA 密钥**：那才是"真换 CA"，仍需全树重分发 trust/。
  identity_cert_days: 30
  ca_cert_days: 3650

  # ===== 授权白名单（留空 = 放行全体合法树成员，够用就别写）=====
  # 【可选】谁可以在本节点发起指令。留空 = 不限（仍要求是可信树成员）。
  # trusted_origins: []
  # 【可选】谁可以查本节点的健康 / 轨迹。留空 = 默认"直接父 + root"；写 "*" 表示不限。
  # health_viewers: []
  # ⚠️ 上面这两项（含 query.query_viewers）**不进 config_hash**：SIGHUP 即刻生效、不重注册。

  # ===== 证书热重载：把"你脚本的换证动作"吃进来 =====
  # 【可选】整段不写 = 开启 + 30s 轮询 + reconnect。不进 config_hash。
  cert_reload:
    enabled: true
    # 轮询间隔，下限 5s。稳态只做 stat（不读文件内容），开销可忽略。
    interval: 30s
    # 【可选·默认自动】额外监视的路径（文件或目录）。留空 = 自动监视：
    #   身份私钥 / 公钥 / 证书 + 本节点 CA 证书 / 私钥 + 全部信任锚。
    # paths: [ keys, certs, trust ]
    #
    # 变更后如何让新证书生效（二选一）：
    #   reconnect（默认）—— 只有"本节点身份证书 / 私钥"变了才主动重连一次（尽快用新证书握手）；
    #                       换 CA、换对端证书这类不影响自己身份的变更只对新连接生效，不打扰现有会话。
    #   lazy             —— 一律只对新连接生效，绝不打断任何现有会话。
    on_change: reconnect

  # ===== 运行期入网：子节点没有证书时，用许可向父换取 =====
  #   对父来说是"**允许别人来入网**"，对子来说是"我去换"。两侧用同一个段。
  #   **入网认证只有一个口径：许可**（token / token_path，两端同值）—— 它是唯一的授权判据，
  #   父端没配它就拒绝一切入网。
  #   （这里**曾经**还有个 allow_ids 白名单，已删除：NodeID 是公开信息、与密钥对没有密码学
  #    绑定，"自报一个名单里的 ID + 自建一对密钥"根本挡不住 —— 想限定"这次准入给谁"，
  #    正确做法是每节点一枚一次性许可，而不是给一份 ID 名单。）
  enrollment:
    # 【可选·默认 true】关掉 = 本节点不接受任何入网请求（已自带证书的树可以关）。
    #   ⚠️ 进 hash 的只有"这个开关"；**凭据本身不进**（换凭据不该触发重注册）。
    enabled: true
    # 【可选】入网**引导凭据**：父端比对其中的 permit，子端提交它，并从它内嵌的 CA 链取锚。
    #   两种给法，token_path 优先：
    #     token_path: 从文件读（推荐，权限 600，便于部署时投放 / 轮换）
    #     token:      直接写在配置里（只能写裸许可串，没法内嵌证书）
    #   文件格式（权威定义见 internal/identity/bootstrap.go）：
    #     permit=<许可串>
    #     -----BEGIN CERTIFICATE-----   ← 父自己的 CA 证书链，含父 CA 一路到根
    #   产出方式：**在父节点目录上**跑 scripts/make_bootstrap.sh <父目录>
    #     （根：scripts/init_root.sh 会顺带产出；中继：先完成自己的入网再给下级产）
    token_path: enroll.token
    # token: <与父一致的许可串>
    #
    # 【可选·默认 5m】一次性挑战（nonce）的有效期，超时需重新申请。
    # challenge_ttl: 5m


# ---------------------------------------------------------------------------
# command —— 指令分发 / 租约 / 超时 等本地运行参数
#   整段都可以不写，全部有默认值。⚠️ 本段**不进 config_hash**，SIGHUP 重读即生效。
#   唯一有硬约束的是租约：**renew_at × 3 ≤ lease_ttl**，写成别的会被拒绝启动。
# ---------------------------------------------------------------------------
command:
  lease_ttl: 90s                   # 父把任务派给子后，子必须在这个时间内续租，否则父判它掉了并回收重派
  renew_at: 30s                    # 子续租间隔（默认 30s）
  max_deadline: 24h                # 单条指令的绝对上限，超过一律按超时收尾
  # 各指令类型的兜底期限（指令里没给 deadline 时用它）；未列出的类型用 unknown_type_deadline
  default_deadline_by_type: { noop: 1m, echo: 1m, probe: 5m, sleep: 5m, shell: 1h, batch: 6h, script: 1h }
  unknown_type_deadline: 15m
  audit_retention: 168h            # 指令审计记录保留多久（超过且已终态就清理）
  eviction_timeout: 24h            # 子多久没出现算"被驱逐"（驱逐前把指令体归档，等它回来对账）
  eviction_archive_retention: 720h # 驱逐归档保留多久（到期连同水位条目一起回收）
  max_inflight: 64                 # 本节点同时执行的**本地**指令上限（超了回 LocalBusy 让父稍后重投）
  # 大结果（>64MB）落本地对象存储的目录；相对路径按 data_dir 展开（默认 data_dir/objects）
  # object_store_dir: objects
  #
  # --- 下发背压：在途窗口（父端"已经在子手上、还没回终态"的分派条数上限）---
  #   没有它的时候，下发侧只有字节上限，一个子可以一次把它名下所有分派全拉走。
  #   ⚠️ 名字里的 dispatch 不能省：上面那个 max_inflight 是**本地执行**并发，两回事。
  #   两个窗口的取值规则：**不写 = 用默认值；显式写 0 = 不限。**
  # max_dispatch_inflight_per_child: 8   # 每个直接子的在途上限。默认 8 —— 单条指令对每个子只有 1 个
  #                                      # 分派，所以 8 只在你同时压了 >8 条指令给同一个子时才生效
  # max_dispatch_inflight: 0             # 所有直接子的在途**总数**上限。默认 0 = 不限（刻意如此：
  #                                      # 固定数字总会在某个扇出规模上开始咬人；要开就按
  #                                      # "总数 ≥ 单子窗口 × 直接子数" 配）
  # dispatch_window_adaptive: false      # true 时单子窗口 = min(上值, max(1, 总数窗口 / 在线子数))：
  #                                      # 子在线的多就收紧、掉线就放宽；只会收紧，不会超过单子上限
  # local_busy_backoff: 3s               # LocalBusy 退避的**基数**：连续被同一个子退回第 n 次，
  #                                      # 就等 min(3s << (n-1), 封顶) 再投 —— 让被同时退回的一批
  #                                      # 指令在时间上自然错开，而不是每 3 秒齐刷刷重投一遍
  # local_busy_backoff_max: 60s          # 上面那个指数退避的封顶
  #
  # --- 下面是内部水位 / 分片 / 重试旋钮：默认值都够用，一般不用动 ---
  # stream_idle_timeout: 180s        分片上传流的空闲超时
  # reserve_for_report: 5s           为"末段上报"预留的时间，避免压着 deadline 丢结果
  # child_stuck_timeout: 5m          子节点"还连着但卡住"的判定阈值
  # lease_reclaim_cap: 3             同一子节点的租约最多连续回收几次
  # max_retry_node_count: 3          单个子节点失败后最多重派几次，超了由父直接判定失败
  # pending_resend_batch: 32         一次补报多少条待上报结果
  # max_report_concurrency: 8        并发处理子报告的上限
  # index_repush_interval: 10m       结果索引向上重推的间隔
  # tick_interval: <自动>            waitChildren 巡检间隔，默认按 min(child_stuck_timeout, lease_ttl)/4 推导（下限 200ms）
  # reconcile_window: <自动>         "应发未发"对账窗口，默认 3 × renew_at
  # max_payload: 1MB                 单条指令 payload 上限
  # max_command_bytes: 3MB           单条 Command 序列化上限（超了父端截断）
  # fetch_response_max_bytes: 3.5MB  一次 FetchCommands 响应的上限
  # max_chunk_total: 300             分片上传的最大片数
  # chunk_size: 256KB                分片大小


# ---------------------------------------------------------------------------
# health —— 全树健康检查 / 指令轨迹（⚠️ 不进 config_hash，SIGHUP 即生效）
# ---------------------------------------------------------------------------
health:
  max_health_fanout: 32            # 一个节点向下扇出的最大并发（防止健康请求把大树打爆）
  health_response_max_bytes: 1MB   # 单次健康响应的大小上限，超了自动降级为"只回摘要不带完整对象"
  rate_limit_per_sec: 10           # 每个对端每秒允许发起的健康请求数（防刷）


# ---------------------------------------------------------------------------
# query —— 结果查询（GET /v1/commands/{id}）（⚠️ 不进 config_hash）
# ---------------------------------------------------------------------------
query:
  # 谁可以查结果。**留空 = 放行全体合法树成员**；写 "*" 同理；列具体 NodeID 才收紧。
  query_viewers: []
  query_route_ttl: 10s             # 查询回程转发表条目的存活时间（超过就丢弃，回程靠重新查询）
  max_query_routes: 1024           # 回程转发表条目的上限（默认 1024）
  query_response_max_bytes: 8MB    # 单次查询响应上限，超了走分片回传（>256KB）或对象存储引用（>8MB）
  req_auth_ttl: 60s                # 跨跳委托凭证（ReqAuth）的有效期


# ---------------------------------------------------------------------------
# registration —— 注册行为（⚠️【进 hash】改了触发全量重注册）
# ---------------------------------------------------------------------------
registration:
  # 重连后要不要补拉"断线期间错过"的指令。NONE = 不补（只处理新指令）。
  # 可选：NONE / SINCE（按时间补）/ FROM_SEQ（按序号补）
  backfill: NONE


# ---------------------------------------------------------------------------
# selfupdate —— 可执行文件一致性（父把自己那份镜像下发给子）
#   ⚠️ 不进 config_hash；**也不在"父可下发"的白名单里**（ConfigPush 只接受
#      command./health./query./persist.），所以改这一项要逐节点改文件 + SIGHUP。
# ---------------------------------------------------------------------------
# 每个节点启动时算一次自己可执行文件的 sha256；子连上后的**第一件事**就是跟父的比：
# 不一致就自己拉取 → 三重校验 → **原地重启**（PID 不变）。所以升级只需要"换根"。
# 【可选 · 默认即下面这些值】
selfupdate:
  enabled: true                    # 总开关
  on_mismatch: sync                # sync=不一致就同步并原地重启（默认）；warn=只告警不重启（先观察一轮时用）
  serve: true                      # 是否把本节点的可执行文件发给直接子（只有有下级的节点才有人问）
  chunk_size: 256KB                # 分片大小（上限 4MB：同一条流上还跑着心跳与指令帧）
  max_bytes: 64MB                  # 单次同步的字节上限（请求方与提供方都按它截断）
  sync_timeout: 60s                # 一次同步（申请 → 收完最后一片）的总时限
  max_attempts: 3                  # 同一目标哈希在 attempt_window 内最多试几次（防重启循环）
  attempt_window: 1h
  # dir: /opt/treecmd/staging      # 暂存文件放哪；默认 = 可执行文件所在目录
  #                                # **必须与可执行文件同文件系统**，否则 rename 退化成复制

  # ===== 镜像分片缓存（"边收边转发" + 断点续传）=====
  # 子先要一份 BinaryManifest（这份镜像由哪些片组成、每片 sha256 是多少），
  # 每片**先过 sha256 再落片存** —— 于是片本身就可证"确实属于那份镜像"，
  # 中继**还没收完、还没重启**就能把已收到的片转发给自己的直接子：收敛从"逐层串行"变"流水线"。
  # 片存目录 = <暂存目录>/pieces/<本节点 ID>/（**按节点隔离**，可执行文件同处一目录也不会互相污染）。
  # 片存是**可丢的缓存**：删掉只会让下次从 0 重来。关掉它 = 完全回到旧行为。
  piece_store: true                # 默认开
  max_serve_concurrency: 4         # 同时向几个直接子供片（中继一边向父拉、一边给多个孙推时要限流）
  # piece_store_max_bytes: 128MB   # 片存总占用上限；默认 = max_bytes × 2，超了按最近使用时间清


# ---------------------------------------------------------------------------
# persist —— 本地状态落盘（⚠️ 不进 config_hash；interval 可 SIGHUP 热更）
# ---------------------------------------------------------------------------
persist:
  state_path: state.dat            # 运行态快照文件（原子写）。账本另有一个 state.db（bbolt），与它同目录
  interval: 30s                    # 快照落盘间隔（默认 30s）



# ---------------------------------------------------------------------------
# data_dir —— 相对路径的基准目录（【可选 · 默认 .】= node.yaml 所在目录）
#   上面所有相对路径（keys/、certs/、trust/、state.dat、objects/）都相对它展开。
# ---------------------------------------------------------------------------
data_dir: .


# ============================================================================
# 第二部分 · 本节点目录里应有什么
# ============================================================================
#
#   启动【前】必须你自己放好：
#     keys/id_ed25519          身份私钥（PKCS8 PEM，权限 600）  ← treecmd-node -genkey -keydir keys
#     keys/id_ed25519.pub      身份公钥（PKIX PEM）
#     keys/ca、keys/ca.pub     CA 密钥对（**有下级才需要**；生成时加 -with-ca）
#     certs/node.crt           身份证书链（**根必须自带**；其它角色可缺 → 待入网）
#     certs/node.crt.ca        本节点 CA 证书链（有下级才需要；根由 scripts/init_root.sh 产出）
#     trust/                   目录，放信任锚（**可省**）—— 若用父产出的引导凭据，这一项不用配；
#                              要用就放**你的父的** certs/node.crt.ca（整份文件）。
#                              就算配了也只在**首次入网**需要；入网成功后可以删（锚从自己的证书链自举）
#     enroll.token             **入网引导凭据**（父产出、整份拷过来，权限 600）
#                              = 许可 + 父的 CA 链；产出用 scripts/make_bootstrap.sh <父目录>
#
#   启动【后】由程序自己产出（你不用管，目录会自动建）：
#     state.db / state.dat     本地账本与状态快照
#     objects/                 >64MB 大结果的对象存储
#     node.log / node.pid      scripts/start_node.sh 产出的日志与 PID
#
#   ⚠️ 约定：上面这些路径**不写配置也能跑** —— 程序按同名约定补全（见 config.applyDefaults）。
#      目录布局与约定不同、或想显式声明（不留隐式行为），就在本文件里把它们写出来。
# ============================================================================


# ============================================================================
# 第三部分 · 命令速查
# ============================================================================
#
#   首次部署（根）：cd <节点目录> && scripts/init_root.sh          # 参数全可省：目录=当前目录，NodeID 自动生成
#                     也可指定：scripts/init_root.sh <节点目录> [根节点ID] [身份天数] [CA天数]
#                     一次性生成根的自签材料（密钥对 + CA + certs/），产出 enroll.token
#                     （= 入网引导凭据：许可 + 根自己的 CA 链），并给出下一步提示
#   产出入网凭据：  scripts/make_bootstrap.sh <本节点目录> [输出文件] [--new-permit]
#                     有下级的节点才需要（它要有 certs/node.crt.ca）——**根用它，中继也用它**：
#                     执行后就地写出/升级 enroll.token，把它**整份**拷给每个子节点即可。
#                     默认**沿用**已有许可（换许可会让子节点手上的旧凭据全部作废）。
#   生成密钥对：    treecmd-node -genkey -keydir keys [-with-ca] [-force]
#                     -with-ca 只在"有下级"时加；**启动路径绝不生成密钥**
#   启动：          treecmd-node -config node.yaml [-log-level debug|info|warn|error]
#   只入网一次：    treecmd-node -enroll -config node.yaml   （换到证书就退出，不常驻）
#   起停 / 运维：   scripts/start_node.sh [start|status|reload|conf|stop] <node.yaml>
#                     reload = kill -USR1（换证后立即重载证书）
#                     conf   = kill -HUP（重读本文件）
#   怎么自检：      ★ 没有"检查"子命令 —— 配置与材料的问题都在启动路径上报出来：
#                     "REFUSE TO START: ..." + 非零退出；"证书暂缺"只是一条 WARN（待入网）。
#   看状态：        curl -s localhost:18443/v1/tree      # 拓扑 + 每个节点的 build_hash
#                   curl -s localhost:18443/metrics
# ============================================================================
